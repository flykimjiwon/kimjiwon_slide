<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">자동 프롬프트 최적화 흐름</title>
  <desc id="desc">여러 프롬프트 후보를 만들고 평가한 뒤 실패한 후보는 다시 쓰고 가장 좋은 프롬프트를 선택하는 흐름입니다.</desc>
  <defs>
    <symbol id="list" viewBox="0 0 24 24"><path d="M9 6.6h11M9 12h11M9 17.4h11"/><path d="M4.6 6.6h.01M4.6 12h.01M4.6 17.4h.01"/></symbol>
    <symbol id="gate" viewBox="0 0 24 24"><path d="M12 3.4 19 6v5.4c0 4.2-2.8 7.4-7 8.9-4.2-1.5-7-4.7-7-8.9V6l7-2.6Z"/><path d="m8.9 11.9 2.2 2.2 4.1-4.4"/></symbol>
    <symbol id="pencil" viewBox="0 0 24 24"><path d="M4.2 19.8h3.9L18.4 9.5a2.4 2.4 0 0 0-3.4-3.4L4.7 16.4l-.5 3.4Z"/><path d="m13.6 7.4 3.4 3.4"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.3 12.3 2.5 2.5 4.9-5.3"/></symbol>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;fill:#111827}.title{font-size:36px;font-weight:850}.muted{fill:#5f6672}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#fff"/>
  <text x="70" y="80" class="title">프롬프트도 만들고, 시험하고, 다시 고칩니다</text>
  <g transform="translate(70 155)">
    <g><text x="115" y="0" text-anchor="middle" font-size="27" font-weight="850">후보 만들기</text><g transform="translate(0 35)"><rect width="230" height="85" rx="16" fill="#f5efff"/><use href="#list" x="18" y="20" width="45" height="45" class="icon" color="#7c3aed"/><text x="78" y="53" font-size="23" font-weight="800">프롬프트 A</text><rect y="105" width="230" height="85" rx="16" fill="#f5efff"/><use href="#list" x="18" y="125" width="45" height="45" class="icon" color="#7c3aed"/><text x="78" y="158" font-size="23" font-weight="800">프롬프트 B</text><rect y="210" width="230" height="85" rx="16" fill="#f5efff"/><use href="#list" x="18" y="230" width="45" height="45" class="icon" color="#7c3aed"/><text x="78" y="263" font-size="23" font-weight="800">프롬프트 C</text></g></g>
    <path d="M250 182h100" stroke="#0ea5e9" stroke-width="7"/><path d="m338 166 20 16-20 16" fill="none" stroke="#0ea5e9" stroke-width="7"/>
    <g transform="translate(370 78)"><rect width="250" height="210" rx="24" fill="#fff5ea" stroke="#fed7aa" stroke-width="3"/><use href="#gate" x="87" y="25" width="76" height="76" class="icon" color="#ea580c"/><text x="125" y="135" text-anchor="middle" font-size="29" font-weight="850">문제집으로 평가</text><text x="125" y="174" text-anchor="middle" class="muted" font-size="22">점수 · 통과 여부</text></g>
    <path d="M640 182h100" stroke="#16a34a" stroke-width="7"/><path d="m728 166 20 16-20 16" fill="none" stroke="#16a34a" stroke-width="7"/>
    <g transform="translate(760 78)"><rect width="300" height="210" rx="24" fill="#eefcf4" stroke="#bbf7d0" stroke-width="3"/><use href="#check" x="112" y="25" width="76" height="76" class="icon" color="#16a34a"/><text x="150" y="135" text-anchor="middle" font-size="29" font-weight="850">가장 좋은 문구</text><text x="150" y="174" text-anchor="middle" class="muted" font-size="22">실제 점수로 선택</text></g>
    <path d="M495 300v118H115V350" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
    <path d="m99 372 16-20 16 20" fill="none" stroke="#dc2626" stroke-width="7"/>
    <rect x="260" y="315" width="245" height="92" rx="18" fill="#fff0f5" stroke="#fecdd3" stroke-width="3"/>
    <use href="#pencil" x="280" y="337" width="48" height="48" class="icon" color="#dc2626"/><text x="345" y="351" font-size="24" font-weight="800">점수가 낮으면</text><text x="345" y="383" font-size="22" class="muted">다시 써서 재평가</text>
  </g>
  <rect x="70" y="590" width="1060" height="60" rx="18" fill="#111827"/>
  <text x="600" y="629" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">좋은 문구를 외우는 것이 아니라, 좋은 문구를 찾아내는 반복 과정을 설계합니다.</text>
</svg>
