<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">루프 엔지니어링의 반복 흐름</title>
  <desc id="desc">목표를 정하고 개발과 테스트를 거친 뒤 실패하면 수정해 다시 개발하고, 성공하면 종료하는 반복 흐름입니다.</desc>
  <defs>
    <symbol id="terminal" viewBox="0 0 24 24"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4"/><path d="m7.6 10.2 2.4 1.9-2.4 1.9M13 15.2h3.8"/></symbol>
    <symbol id="gate" viewBox="0 0 24 24"><path d="M12 3.4 19 6v5.4c0 4.2-2.8 7.4-7 8.9-4.2-1.5-7-4.7-7-8.9V6l7-2.6Z"/><path d="m8.9 11.9 2.2 2.2 4.1-4.4"/></symbol>
    <symbol id="pencil" viewBox="0 0 24 24"><path d="M4.2 19.8h3.9L18.4 9.5a2.4 2.4 0 0 0-3.4-3.4L4.7 16.4l-.5 3.4Z"/><path d="m13.6 7.4 3.4 3.4"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.3 12.3 2.5 2.5 4.9-5.3"/></symbol>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.title{font-size:36px;font-weight:850}.muted{fill:#5f6672}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#fff"/>
  <text x="70" y="80" class="title">통과할 때까지 한 바퀴를 다시 돕니다</text>
  <g transform="translate(70 170)">
    <g><circle cx="90" cy="100" r="82" fill="#e8f2ff"/><circle cx="90" cy="100" r="45" fill="none" stroke="#0066cc" stroke-width="8"/><circle cx="90" cy="100" r="22" fill="#0066cc"/><text x="90" y="220" text-anchor="middle" font-size="26" font-weight="800">목표 설정</text></g>
    <path d="M180 100h110" stroke="#0ea5e9" stroke-width="7"/><path d="m278 84 20 16-20 16" fill="none" stroke="#0ea5e9" stroke-width="7"/>
    <g transform="translate(300)"><circle cx="90" cy="100" r="82" fill="#f5efff"/><use href="#terminal" x="48" y="58" width="84" height="84" class="icon" color="#7c3aed"/><text x="90" y="220" text-anchor="middle" font-size="26" font-weight="800">AI 개발</text></g>
    <path d="M480 100h110" stroke="#0ea5e9" stroke-width="7"/><path d="m578 84 20 16-20 16" fill="none" stroke="#0ea5e9" stroke-width="7"/>
    <g transform="translate(600)"><circle cx="90" cy="100" r="82" fill="#fff5ea"/><use href="#gate" x="48" y="58" width="84" height="84" class="icon" color="#ea580c"/><text x="90" y="220" text-anchor="middle" font-size="26" font-weight="800">테스트</text></g>
    <path d="M780 100h110" stroke="#16a34a" stroke-width="7"/><path d="m878 84 20 16-20 16" fill="none" stroke="#16a34a" stroke-width="7"/>
    <g transform="translate(900)"><circle cx="90" cy="100" r="82" fill="#eefcf4"/><use href="#check" x="48" y="58" width="84" height="84" class="icon" color="#16a34a"/><text x="90" y="220" text-anchor="middle" font-size="26" font-weight="800">성공 · 종료</text></g>
    <path d="M690 188v165H390V188" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
    <path d="m374 210 16-20 16 20" fill="none" stroke="#dc2626" stroke-width="7"/>
    <rect x="450" y="300" width="180" height="90" rx="18" fill="#fff0f5" stroke="#fecdd3" stroke-width="3"/>
    <use href="#pencil" x="475" y="321" width="48" height="48" class="icon" color="#dc2626"/><text x="545" y="348" font-size="24" font-weight="800">실패하면</text><text x="545" y="379" font-size="22" class="muted">수정 후 재실행</text>
  </g>
  <rect x="70" y="580" width="1060" height="65" rx="18" fill="#111827"/>
  <text x="600" y="622" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">AI의 “완료했습니다”가 아니라 테스트·빌드·실행 결과가 종료를 결정합니다.</text>
</svg>
