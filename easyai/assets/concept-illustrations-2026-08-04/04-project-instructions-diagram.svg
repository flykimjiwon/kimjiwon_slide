<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">프로젝트 지침 파일을 읽고 작업을 시작하는 흐름</title>
  <desc id="desc">프로젝트를 열고 AGENTS.md와 CLAUDE.md를 읽은 뒤 규칙을 이해하고 코딩과 테스트를 시작하는 흐름입니다.</desc>
  <defs>
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 7c0-1.1-.9-2-2-2H4v13h6c1.1 0 2 .9 2 2V7Z"/><path d="M12 7c0-1.1.9-2 2-2h6v13h-6c-1.1 0-2 .9-2 2V7Z"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><path d="M9 6.6h11M9 12h11M9 17.4h11"/><path d="M4.6 6.6h.01M4.6 12h.01M4.6 17.4h.01"/></symbol>
    <symbol id="terminal" viewBox="0 0 24 24"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4"/><path d="m7.6 10.2 2.4 1.9-2.4 1.9M13 15.2h3.8"/></symbol>
    <symbol id="gate" viewBox="0 0 24 24"><path d="M12 3.4 19 6v5.4c0 4.2-2.8 7.4-7 8.9-4.2-1.5-7-4.7-7-8.9V6l7-2.6Z"/><path d="m8.9 11.9 2.2 2.2 4.1-4.4"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h13M12.5 6.5 19 12l-6.5 5.5"/></symbol>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.title{font-size:36px;font-weight:850}.muted{fill:#5f6672}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#fff"/>
  <text x="70" y="80" class="title">에이전트의 첫 출근</text>
  <text x="70" y="118" class="muted" font-size="24">프로젝트를 열면 지침부터 읽고, 그 규칙 안에서 일을 시작합니다.</text>
  <g transform="translate(70 180)">
    <g><rect width="230" height="270" rx="24" fill="#e8f2ff"/><path d="M52 88h126v102H52z" fill="#fff" stroke="#0066cc" stroke-width="5"/><path d="M52 88v-28h55l18 18h53v12" fill="#fff" stroke="#0066cc" stroke-width="5" stroke-linejoin="round"/><text x="115" y="228" text-anchor="middle" font-size="29" font-weight="800">프로젝트 열기</text></g>
    <use href="#arrow" x="242" y="106" width="54" height="54" class="icon" color="#8a93a3"/>
    <g transform="translate(308)"><rect width="260" height="270" rx="24" fill="#f5efff"/><use href="#book" x="95" y="28" width="70" height="70" class="icon" color="#7c3aed"/><rect x="32" y="118" width="196" height="48" rx="12" fill="#fff"/><text x="130" y="150" text-anchor="middle" font-family="monospace" font-size="24" font-weight="800">AGENTS.md</text><rect x="32" y="176" width="196" height="48" rx="12" fill="#fff"/><text x="130" y="208" text-anchor="middle" font-family="monospace" font-size="24" font-weight="800">CLAUDE.md</text><text x="130" y="255" text-anchor="middle" font-size="25" font-weight="800">지침 먼저 읽기</text></g>
    <use href="#arrow" x="580" y="106" width="54" height="54" class="icon" color="#8a93a3"/>
    <g transform="translate(646)"><rect width="200" height="270" rx="24" fill="#fff5ea"/><use href="#list" x="65" y="30" width="70" height="70" class="icon" color="#ea580c"/><text x="100" y="142" text-anchor="middle" font-size="25" font-weight="800">규칙 이해</text><text x="100" y="184" text-anchor="middle" class="muted" font-size="21">구조 · 빌드</text><text x="100" y="217" text-anchor="middle" class="muted" font-size="21">테스트 · 금지사항</text></g>
    <use href="#arrow" x="858" y="106" width="54" height="54" class="icon" color="#8a93a3"/>
    <g transform="translate(924)"><rect width="206" height="270" rx="24" fill="#eefcf4"/><use href="#terminal" x="42" y="30" width="58" height="58" class="icon" color="#16a34a"/><use href="#gate" x="108" y="30" width="58" height="58" class="icon" color="#16a34a"/><text x="103" y="142" text-anchor="middle" font-size="25" font-weight="800">작업 시작</text><text x="103" y="184" text-anchor="middle" class="muted" font-size="21">코드 작성</text><text x="103" y="217" text-anchor="middle" class="muted" font-size="21">빌드와 테스트</text></g>
  </g>
  <rect x="70" y="505" width="1060" height="105" rx="20" fill="#111827"/>
  <text x="105" y="550" fill="#0ea5e9" font-size="27" font-weight="850">매번 설명할 필요가 줄어듭니다.</text>
  <text x="105" y="586" fill="#e8ecf3" font-size="24">프로젝트의 공통 규칙을 파일로 남기면 다음 세션도 같은 기준에서 시작합니다.</text>
</svg>
