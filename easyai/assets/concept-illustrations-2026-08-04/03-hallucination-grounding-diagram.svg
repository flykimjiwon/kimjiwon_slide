<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">환각과 그라운딩 비교</title>
  <desc id="desc">근거 없이 그럴듯한 말을 만드는 환각과 문서, 코드, 검색 결과에 답을 연결하는 그라운딩을 비교합니다.</desc>
  <defs>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.3"/><path d="m15.7 15.7 4.4 4.4"/></symbol>
    <symbol id="terminal" viewBox="0 0 24 24"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4"/><path d="m7.6 10.2 2.4 1.9-2.4 1.9M13 15.2h3.8"/></symbol>
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 7c0-1.1-.9-2-2-2H4v13h6c1.1 0 2 .9 2 2V7Z"/><path d="M12 7c0-1.1.9-2 2-2h6v13h-6c-1.1 0-2 .9-2 2V7Z"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.3 12.3 2.5 2.5 4.9-5.3"/></symbol>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;fill:#111827}.title{font-size:36px;font-weight:850}.muted{fill:#5f6672}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#fff"/>
  <text x="70" y="78" class="title">그럴듯한 말과 근거 있는 답은 다릅니다</text>
  <g transform="translate(70 125)">
    <rect width="500" height="450" rx="26" fill="#fff0f5" stroke="#fecdd3" stroke-width="3"/>
    <text x="35" y="55" fill="#dc2626" font-size="31" font-weight="850">환각</text>
    <rect x="45" y="95" width="410" height="170" rx="28" fill="#fff" stroke="#f43f5e" stroke-width="4"/>
    <path d="M145 265l-30 48 72-48" fill="#fff" stroke="#f43f5e" stroke-width="4" stroke-linejoin="round"/>
    <text x="250" y="150" text-anchor="middle" font-size="27" font-weight="750">“없는 기능인데도</text>
    <text x="250" y="190" text-anchor="middle" font-size="27" font-weight="750">이미 지원됩니다.”</text>
    <text x="250" y="238" text-anchor="middle" fill="#dc2626" font-size="40" font-weight="900">???</text>
    <text x="250" y="350" text-anchor="middle" font-size="27" font-weight="800">근거가 없습니다</text>
    <text x="250" y="390" text-anchor="middle" class="muted" font-size="23">하지만 문장은 그럴듯합니다.</text>
  </g>
  <g transform="translate(630 125)">
    <rect width="500" height="450" rx="26" fill="#eefcf4" stroke="#bbf7d0" stroke-width="3"/>
    <text x="35" y="55" fill="#16a34a" font-size="31" font-weight="850">그라운딩</text>
    <g transform="translate(35 95)">
      <rect width="120" height="115" rx="18" fill="#fff"/><use href="#book" x="36" y="20" width="48" height="48" class="icon" color="#0066cc"/><text x="60" y="94" text-anchor="middle" font-size="21" font-weight="750">문서</text>
      <rect x="145" width="120" height="115" rx="18" fill="#fff"/><use href="#terminal" x="181" y="20" width="48" height="48" class="icon" color="#7c3aed"/><text x="205" y="94" text-anchor="middle" font-size="21" font-weight="750">코드</text>
      <rect x="290" width="120" height="115" rx="18" fill="#fff"/><use href="#search" x="326" y="20" width="48" height="48" class="icon" color="#ea580c"/><text x="350" y="94" text-anchor="middle" font-size="21" font-weight="750">검색</text>
    </g>
    <path d="M95 225v38h310v-38M250 263v35" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
    <rect x="105" y="298" width="290" height="78" rx="18" fill="#111827"/>
    <text x="250" y="345" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">이번 답의 근거</text>
    <use href="#check" x="205" y="385" width="90" height="90" class="icon" color="#16a34a"/>
  </g>
  <text x="600" y="624" text-anchor="middle" font-size="27" font-weight="800">힌트를 많이 주는 것보다, 답과 근거를 연결해 다시 확인할 수 있게 하는 것이 핵심입니다.</text>
</svg>
