<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">바이브 코딩과 에이전틱 엔지니어링 비교</title>
  <desc id="desc">말로 시켜 바로 결과만 보는 바이브 코딩과 계획, 개발, 테스트, 검토를 거치는 에이전틱 엔지니어링을 비교합니다.</desc>
  <defs>
    <symbol id="terminal" viewBox="0 0 24 24"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4"/><path d="m7.6 10.2 2.4 1.9-2.4 1.9M13 15.2h3.8"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><path d="M9 6.6h11M9 12h11M9 17.4h11"/><path d="M4.6 6.6h.01M4.6 12h.01M4.6 17.4h.01"/></symbol>
    <symbol id="gate" viewBox="0 0 24 24"><path d="M12 3.4 19 6v5.4c0 4.2-2.8 7.4-7 8.9-4.2-1.5-7-4.7-7-8.9V6l7-2.6Z"/><path d="m8.9 11.9 2.2 2.2 4.1-4.4"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.3"/><path d="m15.7 15.7 4.4 4.4"/></symbol>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;fill:#111827}.title{font-size:36px;font-weight:850}.muted{fill:#5f6672}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#fff"/>
  <text x="70" y="78" class="title">말로 끝내는가, 결과까지 확인하는가</text>
  <g transform="translate(70 125)">
    <rect width="470" height="470" rx="26" fill="#fff0f5" stroke="#fecdd3" stroke-width="3"/>
    <text x="35" y="55" fill="#dc2626" font-size="31" font-weight="850">바이브 코딩</text>
    <rect x="88" y="105" width="294" height="92" rx="46" fill="#dc2626"/>
    <text x="235" y="164" text-anchor="middle" fill="#fff" font-size="37" font-weight="900">딸깍</text>
    <path d="M235 215v60" stroke="#8a93a3" stroke-width="5"/><path d="m220 260 15 18 15-18" fill="none" stroke="#8a93a3" stroke-width="5"/>
    <rect x="92" y="292" width="286" height="96" rx="18" fill="#fff" stroke="#f43f5e" stroke-width="4"/>
    <use href="#terminal" x="112" y="312" width="56" height="56" class="icon" color="#dc2626"/>
    <text x="188" y="334" font-size="25" font-weight="800">결과는 나왔지만</text><text x="188" y="369" class="muted" font-size="23">검수 여부는 모릅니다</text>
    <text x="235" y="435" text-anchor="middle" fill="#dc2626" font-size="25" font-weight="800">빠른 시제품에는 유용</text>
  </g>
  <g transform="translate(600 125)">
    <rect width="530" height="470" rx="26" fill="#eefcf4" stroke="#bbf7d0" stroke-width="3"/>
    <text x="35" y="55" fill="#16a34a" font-size="31" font-weight="850">에이전틱 엔지니어링</text>
    <g transform="translate(35 100)">
      <g><circle cx="54" cy="54" r="52" fill="#e8f2ff"/><use href="#list" x="26" y="26" width="56" height="56" class="icon" color="#0066cc"/><text x="54" y="137" text-anchor="middle" font-size="23" font-weight="800">계획</text></g>
      <path d="M112 54h48" stroke="#8a93a3" stroke-width="5"/><path d="m148 42 16 12-16 12" fill="none" stroke="#8a93a3" stroke-width="5"/>
      <g transform="translate(170)"><circle cx="54" cy="54" r="52" fill="#f5efff"/><use href="#terminal" x="26" y="26" width="56" height="56" class="icon" color="#7c3aed"/><text x="54" y="137" text-anchor="middle" font-size="23" font-weight="800">개발</text></g>
      <path d="M282 54h48" stroke="#8a93a3" stroke-width="5"/><path d="m318 42 16 12-16 12" fill="none" stroke="#8a93a3" stroke-width="5"/>
      <g transform="translate(340)"><circle cx="54" cy="54" r="52" fill="#fff5ea"/><use href="#gate" x="26" y="26" width="56" height="56" class="icon" color="#ea580c"/><text x="54" y="137" text-anchor="middle" font-size="23" font-weight="800">테스트</text></g>
    </g>
    <path d="M429 270v40H101v-40" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
    <rect x="145" y="310" width="240" height="96" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/>
    <use href="#search" x="168" y="330" width="56" height="56" class="icon" color="#16a34a"/>
    <text x="242" y="350" font-size="25" font-weight="800">사람이 검토</text><text x="242" y="383" class="muted" font-size="22">통과해야 완료</text>
    <text x="265" y="446" text-anchor="middle" fill="#16a34a" font-size="25" font-weight="800">실제 결과가 완료 조건을 증명</text>
  </g>
</svg>
