<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">모델의 제안을 하네스가 실행하고 통제하는 흐름</title>
  <desc id="desc">모델이 다음 행동을 제안하면 하네스가 권한과 규칙을 확인하고 실제 도구를 실행한 뒤 결과를 모델에 돌려주는 흐름입니다.</desc>
  <defs>
    <symbol id="chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.2"/><path d="M10 4.2v2.6M14 4.2v2.6M10 17.2v2.6M14 17.2v2.6M4.2 10h2.6M4.2 14h2.6M17.2 10h2.6M17.2 14h2.6"/></symbol>
    <symbol id="gate" viewBox="0 0 24 24"><path d="M12 3.4 19 6v5.4c0 4.2-2.8 7.4-7 8.9-4.2-1.5-7-4.7-7-8.9V6l7-2.6Z"/><path d="m8.9 11.9 2.2 2.2 4.1-4.4"/></symbol>
    <symbol id="terminal" viewBox="0 0 24 24"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4"/><path d="m7.6 10.2 2.4 1.9-2.4 1.9M13 15.2h3.8"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h13M12.5 6.5 19 12l-6.5 5.5"/></symbol>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;fill:#111827}.title{font-size:36px;font-weight:850}.muted{fill:#5f6672}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="675" rx="30" fill="#fff"/>
  <text x="70" y="80" class="title">모델은 제안하고, 하네스가 실제로 움직입니다</text>
  <g transform="translate(70 170)">
    <g><rect width="260" height="250" rx="26" fill="#111827"/><use href="#chip" x="95" y="38" width="70" height="70" class="icon" color="#0ea5e9"/><text x="130" y="150" text-anchor="middle" fill="#fff" font-size="31" font-weight="850">모델</text><text x="130" y="192" text-anchor="middle" fill="#9fb0cc" font-size="23">다음 행동을 제안</text></g>
    <use href="#arrow" x="278" y="98" width="56" height="56" class="icon" color="#8a93a3"/>
    <g transform="translate(350)"><rect width="410" height="250" rx="26" fill="#e8f2ff" stroke="#0066cc" stroke-width="4"/><use href="#gate" x="170" y="24" width="70" height="70" class="icon" color="#0066cc"/><text x="205" y="126" text-anchor="middle" font-size="31" font-weight="850">하네스</text><g font-size="22" font-weight="750"><rect x="30" y="155" width="105" height="50" rx="12" fill="#fff"/><text x="82" y="188" text-anchor="middle">권한</text><rect x="152" y="155" width="105" height="50" rx="12" fill="#fff"/><text x="204" y="188" text-anchor="middle">규칙</text><rect x="274" y="155" width="105" height="50" rx="12" fill="#fff"/><text x="326" y="188" text-anchor="middle">검증</text></g></g>
    <use href="#arrow" x="778" y="98" width="56" height="56" class="icon" color="#8a93a3"/>
    <g transform="translate(850)"><rect width="280" height="250" rx="26" fill="#eefcf4"/><use href="#terminal" x="105" y="38" width="70" height="70" class="icon" color="#16a34a"/><text x="140" y="150" text-anchor="middle" font-size="31" font-weight="850">도구 실행</text><text x="140" y="192" text-anchor="middle" class="muted" font-size="23">파일 · 명령 · Git</text></g>
  </g>
  <path d="M1000 445v80H200v-80" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <path d="m185 465 15-22 15 22" fill="none" stroke="#0ea5e9" stroke-width="6"/>
  <text x="600" y="505" text-anchor="middle" fill="#0066cc" font-size="25" font-weight="800">실행 결과를 다시 모델에 전달</text>
  <rect x="70" y="565" width="1060" height="70" rx="18" fill="#fff5ea"/>
  <text x="600" y="610" text-anchor="middle" font-size="26" font-weight="800">허용된 도구·권한·규칙 안에서만 움직이게 만드는 것이 하네스의 역할입니다.</text>
</svg>
