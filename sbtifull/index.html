<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<!-- 🔴 base 필수. 배포 주소가 /sbtifull (뒤 슬래시 없음)이라 base가 없으면
     상대경로 sbti1/index.html 이 /sbti1 — 즉 마스킹 안 된 원본으로 풀린다. -->
<base href="/sbtifull/"/>
<script>if(location.protocol==="file:"){document.querySelector("base").setAttribute("href","./");}</script>
<title>AI 코딩 도구 사내 도입 — 강의 통합본 (공개본)</title>
<link rel="icon" type="image/svg+xml" href="sbti1/assets/aicoding-code-favicon.svg"/>
<style>
  /* 세 덱을 각자 iframe에 그대로 띄우되, 부모가 66장을 하나의 연속된 덱으로 제어한다.
     덱 내부 렌더링에는 개입하지 않으므로 비율·레이아웃이 단독 실행과 동일하다. */
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117}
  #stack{position:absolute;inset:0}
  #stack iframe{position:absolute;inset:0;border:0;width:100%;height:100%;
    visibility:hidden;opacity:0;transition:opacity .16s ease}
  #stack iframe.on{visibility:visible;opacity:1;z-index:1}

  /* 상단 진행바 — 66장 전체 기준 */
  #bar{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.09);z-index:20}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .18s ease}

  /* 하단 컨트롤 */
  /* 덱 자체 푸터(조직명 등)가 하단 중앙에 있어 겹친다 — 오른쪽으로 뺀다. */
  #hud{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:flex-end;
       padding:0 18px 14px;pointer-events:none;
       font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  #pill{pointer-events:auto;display:flex;align-items:center;gap:2px;
        background:rgba(13,17,23,.9);backdrop-filter:blur(10px);
        border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:5px 7px;
        box-shadow:0 8px 28px rgba(0,0,0,.45)}
  #pill button{background:none;border:0;color:#c7d2fe;cursor:pointer;font:inherit;
        font-size:14px;font-weight:800;padding:6px 12px;border-radius:999px;line-height:1}
  #pill button:hover{background:rgba(255,255,255,.1)}
  #pill button:disabled{opacity:.28;cursor:default;background:none}
  #cnt{color:#e8eef7;font-size:12px;font-weight:800;letter-spacing:.06em;padding:0 10px;
       min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
  #cnt small{color:#7d8da4;font-weight:600}
  #part{color:#7ab2ff;font-size:11.5px;font-weight:800;letter-spacing:.05em;
        padding:0 12px 0 4px;border-left:1px solid rgba(255,255,255,.13);white-space:nowrap}

  /* 챕터 점프 */
  #jump{position:absolute;bottom:calc(100% + 9px);right:0;
        display:none;gap:5px;background:rgba(13,17,23,.96);border:1px solid rgba(255,255,255,.13);
        border-radius:13px;padding:7px;box-shadow:0 16px 44px rgba(0,0,0,.55);white-space:nowrap}
  #pill:hover #jump{display:flex}
  #jump a{color:#dbeafe;text-decoration:none;font-size:12px;font-weight:800;
          padding:8px 13px;border-radius:8px}
  #jump a:hover{background:rgba(255,255,255,.1)}
  #jump a.on{background:#2563eb;color:#fff}
  #jump a.alt{color:#8bbcff;border:1px dashed rgba(139,188,255,.42)}

  #boot{position:absolute;inset:0;display:grid;place-items:center;z-index:5;
        color:#5b6b82;font:600 13px ui-monospace,Menlo,monospace;letter-spacing:.08em}

  /* 1페이지에서만 보이는 공개본 PDF 다운로드 칩 */
  #pdfdl{position:fixed;top:16px;right:18px;z-index:20;display:none;align-items:center;gap:8px;
        background:rgba(13,17,23,.9);backdrop-filter:blur(10px);
        border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 16px;
        color:#dbeafe;text-decoration:none;font:800 12.5px "JetBrains Mono",ui-monospace,Menlo,monospace;
        letter-spacing:.04em;box-shadow:0 8px 28px rgba(0,0,0,.45)}
  #pdfdl:hover{background:rgba(37,99,235,.28);border-color:rgba(139,188,255,.5)}
  #pdfdl small{color:#7d8da4;font-weight:600}
  @media print{#hud,#bar,#boot,#pdfdl{display:none}}
</style>
</head>
<body>

<div id="stack">
  <!-- 2·3부는 1부가 뜬 다음 src를 넣는다 — 첫 화면 대역폭을 1부에 몰아준다 -->
  <iframe id="f0" src="sbti1/index.html" title="1부"></iframe>
  <iframe id="f1" data-src="sbti2/index.html" title="2부"></iframe>
  <iframe id="f2" data-src="sbti3/index.html" title="3부"></iframe>
</div>
<div id="boot">덱 불러오는 중…</div>

<div id="bar"><div id="fill"></div></div>

<a id="pdfdl" href="SBTI_공개본.pdf" download="SBTI_공개본.pdf">⬇ PDF 내려받기 <small>모자이크 공개본</small></a>

<div id="hud">
  <div id="pill">
    <div id="jump"></div>
    <button id="prev" title="이전 (←)">‹</button>
    <span id="cnt">— <small>/ —</small></span>
    <button id="next" title="다음 (→)">›</button>
    <span id="part">불러오는 중</span>
  </div>
</div>

<script>
const DECKS = [
  { label:"1부 · AI 코딩 도구 트렌드", short:"1부 · 트렌드" },
  { label:"2부 · 사내 AI 코딩 도구",   short:"2부 · 도구" },
  { label:"3부 · 활용 사례",           short:"3부 · 사례" },
];
const frames = [0,1,2].map(i => document.getElementById("f"+i));
const counts = [0,0,0];
let ready = 0, g = 0;   // g = 전체 66장 기준 인덱스

const $cnt  = document.getElementById("cnt");
const $part = document.getElementById("part");
const $fill = document.getElementById("fill");
const $jump = document.getElementById("jump");
const $pdfdl = document.getElementById("pdfdl");
const $prev = document.getElementById("prev");
const $next = document.getElementById("next");

const total  = () => counts.reduce((a,b) => a+b, 0);
const offset = d => counts.slice(0, d).reduce((a,b) => a+b, 0);

// 전체 인덱스 -> {덱, 덱 안에서의 인덱스}
function locate(gi){
  let r = Math.max(0, Math.min(total()-1, gi));
  for (let d = 0; d < 3; d++){
    if (r < counts[d]) return { d, i:r };
    r -= counts[d];
  }
  return { d:2, i:counts[2]-1 };
}

function render(){
  const { d, i } = locate(g);
  frames.forEach((f, idx) => f.classList.toggle("on", idx === d));
  try { frames[d].contentWindow.show(i); } catch(e){}
  const t = total();
  $cnt.innerHTML = `${g+1} <small>/ ${t}</small>`;
  $part.textContent = DECKS[d].short;
  $fill.style.width = `${((g+1)/t)*100}%`;
  $pdfdl.style.display = g === 0 ? "flex" : "none";   // 다운로드 칩은 1페이지에서만
  $prev.disabled = g <= 0;
  $next.disabled = g >= t-1;
  $jump.querySelectorAll("a[data-d]").forEach(a =>
    a.classList.toggle("on", +a.dataset.d === d));
  document.title = `${DECKS[d].label} — 강의 통합본`;
  try { history.replaceState(null, "", "#" + (g+1)); } catch(e){}
  focusDeck(d);
}

function step(n){ const t = total(); if(!t) return;
  g = Math.max(0, Math.min(t-1, g+n)); render(); }
function goDeck(d){ g = offset(d); render(); }
function focusDeck(d){ try { frames[d].contentWindow.focus(); } catch(e){} }

// 화살표 키는 부모가 가로챈다 — 덱 자체 핸들러는 경계에서 멈추기 때문.
function onKey(e){
  const doc = e.target?.ownerDocument || document;
  if (doc.body?.classList.contains("figmodal-open")) return;   // 확대 모달 열림 → 덱에 양보
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight","PageDown"," "].includes(e.key)){
    e.preventDefault(); e.stopImmediatePropagation(); step(1);
  } else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)){
    e.preventDefault(); e.stopImmediatePropagation(); step(-1);
  } else if (e.key === "Home"){
    e.preventDefault(); e.stopImmediatePropagation(); g = 0; render();
  } else if (e.key === "End"){
    e.preventDefault(); e.stopImmediatePropagation(); g = total()-1; render();
  } else if (["1","2","3"].includes(e.key)){
    e.preventDefault(); e.stopImmediatePropagation(); goDeck(+e.key - 1);
  }
}

const wired = [false, false, false];

function wire(d){
  if (wired[d]) return;
  const f = frames[d];
  let doc, win;
  try { doc = f.contentDocument; win = f.contentWindow; } catch(e){ return; }
  if (!doc || !win.show || !doc.body) return;
  wired[d] = true;

  // 🔴 안전장치: 공개본 표식이 없으면 원본이 잘못 실린 것이다. 그리지 않고 멈춘다.
  if (!doc.querySelector('meta[name="x-sbti-build"][content="mosaic"]')){
    document.body.innerHTML =
      '<div style="position:absolute;inset:0;display:grid;place-items:center;'
      + 'background:#1b1013;color:#fecaca;font:700 15px/1.7 -apple-system,sans-serif;'
      + 'text-align:center;padding:30px">'
      + '<div>공개본이 아닌 덱이 로드됐습니다 — 표시를 중단했습니다.<br>'
      + '<span style="font-weight:400;color:#f8a6a6">iframe이 원본 경로로 풀렸을 수 있습니다. '
      + 'scripts/build_sbtifull.py 를 다시 돌리고 &lt;base href="/sbtifull/"&gt; 를 확인하세요.</span></div></div>';
    throw new Error("mosaic build marker missing in deck " + d);
  }

  counts[d] = doc.querySelectorAll(".slide").length;

  // 덱 자체 카운터·진행바·힌트·컨트롤(← Notes →)을 숨긴다 — 부모가 전체 기준으로 다시 그린다.
  // sbti1/2/3 태그 칩도 뺀다 — 부모 HUD가 1부·2부·3부로 이미 알려준다.
  const st = doc.createElement("style");
  st.textContent = ".counter,.progress,.hint,.sbti-tag,.controls{display:none!important}";
  doc.head.appendChild(st);

  // capture 단계로 덱 핸들러보다 먼저 받는다.
  doc.addEventListener("keydown", onKey, true);

  // 덱 하단 이동 버튼을 전체 기준으로 다시 묶는다.
  const n = doc.querySelector("#next"), p = doc.querySelector("#prev");
  if (n) n.onclick = ev => { ev.preventDefault(); step(1); };
  if (p) p.onclick = ev => { ev.preventDefault(); step(-1); };

  ready++;
  onWired(d);
}

// 점진 부팅 — 1부가 준비되는 즉시 화면을 열고, 2·3부는 뒤에서 이어 받는다.
// 전체 장수(카운터·진행바)는 덱이 붙을 때마다 갱신된다.
let menuBuilt = false;
function buildMenu(){
  if (menuBuilt) return;
  menuBuilt = true;
  DECKS.forEach((s, d) => {
    const a = document.createElement("a");
    a.href = "#"; a.dataset.d = d; a.textContent = s.short;
    a.onclick = ev => { ev.preventDefault(); goDeck(d); };
    $jump.appendChild(a);
  });
  // 용어사전도 공개본(easyaifull)으로 — 원본 /easyai 로 나가는 출구를 남기지 않는다
  [["../easyaifull","EASY AI 용어사전 ↗"],
   ["SBTI_공개본.pdf","PDF 내려받기 ↓"]].forEach(([href,txt]) => {
    const a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.className = "alt"; a.textContent = txt;
    $jump.appendChild(a);
  });
}

function onWired(d){
  if (d === 0){
    document.getElementById("boot")?.remove();
    buildMenu();
    frames.slice(1).forEach(f => { if (!f.src) f.src = f.dataset.src; });
  }
  render();
  if (ready === 3){
    // 시작 위치: #12 같은 해시는 전체 장수가 확정된 뒤에 적용
    const h = parseInt((location.hash||"").replace("#",""), 10);
    if (h >= 1 && h <= total() && h-1 !== g){ g = h-1; render(); }
  }
}

// load 이벤트는 덱의 모든 이미지·영상까지 기다린다 — 스크립트(show)가 준비된
// 시점에 바로 연결해 첫 화면이 에셋 로딩에 볼모잡히지 않게 한다.
frames.forEach((f, d) => {
  const t = setInterval(() => {
    try { if (f.contentWindow?.show && f.contentDocument?.body){ wire(d); } } catch(e){}
    if (wired[d]) clearInterval(t);
  }, 60);
  f.addEventListener("load", () => wire(d));
});

$prev.onclick = () => step(-1);
$next.onclick = () => step(1);
document.addEventListener("keydown", onKey, true);
addEventListener("hashchange", () => {
  const h = parseInt((location.hash||"").replace("#",""), 10);
  if (h >= 1 && h <= total() && h-1 !== g){ g = h-1; render(); }
});
</script>
</body>
</html>
